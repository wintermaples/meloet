[workspace]
resolver = "3"
members = [
    "crates/*",
    "spikes/s1-render/src-tauri",
    "spikes/plugins/core",
    "spikes/plugins/vst3",
    "spikes/plugins/lv2",
    "spikes/plugins/probe",
    "spikes/plugins/ipcbench",
    "spikes/s4-latency/src-tauri",
    "spikes/sample-load",
]
# `cargo build` / `cargo test` at the root touch only the product crates. The spikes stay buildable with -p.
default-members = [
    "crates/meloet-model",
    "crates/meloet-protocol",
    "crates/meloet-engine",
    "crates/meloet-midi",
    "crates/meloet-devices",
    "crates/meloet-sound",
    "crates/meloet-plugin",
    "crates/meloet-plughost",
    "crates/meloet-core",
    "crates/meloet-app",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
meloet-model = { path = "crates/meloet-model" }
meloet-protocol = { path = "crates/meloet-protocol" }
meloet-engine = { path = "crates/meloet-engine" }
meloet-midi = { path = "crates/meloet-midi" }
meloet-devices = { path = "crates/meloet-devices" }
meloet-sound = { path = "crates/meloet-sound" }
meloet-core = { path = "crates/meloet-core" }
meloet-plugin = { path = "crates/meloet-plugin" }
# Same versions the spikes were measured with (docs/report.md 9).
alsa = "=0.11.0"
cpal = { version = "=0.18.2", default-features = false, features = ["pipewire"] }
dbus = "0.9.12"
dirs = "7.0.0"
libc = "0.2.191"
livi = "=0.9.0"
lv2_raw = "=0.3.2"
pipewire = "=0.10.1"
rtrb = "=0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
ts-rs = "=12.0.1"
tauri = "=2.12.5"
tauri-build = "=2.7.4"
vst3 = "=0.3.0"


# Debug builds read the sound pack almost as fast as release builds (the grand piano took 8.1 s
# instead of about 0.3 s, and its track is silent until it is read). Only the decoder and the
# sampler are built this way.
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.meloet-sound]
opt-level = 3
# The same for audio files brought into a song: the decoders, the resampler and the hash.
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.audioadapter]
opt-level = 3
[profile.dev.package.audioadapter-buffers]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
