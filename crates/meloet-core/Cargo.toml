[package]
name = "meloet-core"
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The development and measuring hooks: the MELOET_* places, the measurements, the test keyboards,
# the test server of the sound pack. Not in the build that is handed out
# (docs/architecture.md 23-11).
dev-hooks = ["meloet-midi/dev-hooks", "meloet-engine/dev-hooks"]

[dependencies]
dirs = { workspace = true }
meloet-devices = { workspace = true }
meloet-engine = { workspace = true }
meloet-midi = { workspace = true }
meloet-model = { workspace = true }
meloet-plugin = { workspace = true }
meloet-protocol = { workspace = true }
meloet-sound = { workspace = true }
meloet-stretch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The free room of the disk before a fetch (statvfs).
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
# The sound pack is fetched over HTTPS on a thread of its own (docs/architecture.md 23-2).
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
# Audio files brought into a song: decoded here, and brought to the rate the audio runs at.
# `id3v2`: an mp3 with a tag at its head (an exported one, with its picture) is read past it;
# without it the probe looks for the first frame in at most 1 MB.
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "wav", "pcm", "mp3", "ogg", "vorbis", "id3v2"] }
rubato = { version = "=5.1.0", default-features = false, features = ["fft_resampler"] }
# The flac files of an export. Without its threads: the export has a thread of its own.
flacenc = { version = "=0.5.1", default-features = false }
# The true peak of an export's check (ITU-R BS.1770 4× oversampling), on the export's thread.
ebur128 = { version = "=0.1.11", default-features = false }
# The mp3 files of an export (pure Rust, no dependencies). It reads tuning knobs from the
# environment: `MP3_ENCODER_ENV` in src/export/sink.rs lists them for this version.
rusty_mp3 = { version = "=1.2.2", default-features = false }
# 「曲の情報」 of an export: ID3v2 in mp3, Vorbis comments in flac, RIFF INFO in wav. With its
# default feature (flate2): 0.25.5 does not build without it.
lofty = { version = "=0.25.5" }

[dev-dependencies]
# The tests reach the hooks above (MELOET_INPUT_SINK_MONITOR, the measurements).
meloet-core = { path = ".", features = ["dev-hooks"] }
# The export's engine is watched for memory taken in its blocks, as the playing one is.
meloet-engine = { workspace = true, features = ["rt-check"] }
# The tests look at the plugin windows as a person's desktop has them.
x11rb = { version = "=0.14.0", features = ["allow-unsafe-code"] }
