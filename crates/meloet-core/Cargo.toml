[package]
name = "meloet-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dirs = { workspace = true }
meloet-devices = { workspace = true }
meloet-engine = { workspace = true }
meloet-midi = { workspace = true }
meloet-model = { workspace = true }
meloet-plugin = { workspace = true }
meloet-protocol = { workspace = true }
meloet-sound = { workspace = true }
meloet-stretch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Audio files brought into a song: decoded here, and brought to the rate the audio runs at.
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "wav", "pcm", "mp3", "ogg", "vorbis"] }
rubato = { version = "=5.1.0", default-features = false, features = ["fft_resampler"] }

[dev-dependencies]
# The tests look at the plugin windows as a person's desktop has them.
x11rb = { version = "=0.14.0", features = ["allow-unsafe-code"] }
