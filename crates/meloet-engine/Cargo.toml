[package]
name = "meloet-engine"
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test builds only: marks the audio block on a thread-local flag so a counting allocator can
# see allocations made inside it. Off in the product build, where the marker is a no-op.
rt-check = []
# MELOET_ENGINE_RT, for tests and measurements. Not in the build that is handed out (23-11).
dev-hooks = []

[dependencies]
cpal.workspace = true
# libdbus, already linked by meloet-app: asks rtkit for a real-time priority.
dbus.workspace = true
libc.workspace = true
meloet-model.workspace = true
meloet-plugin.workspace = true
rtrb.workspace = true

[dev-dependencies]
meloet-engine = { path = ".", features = ["rt-check"] }
