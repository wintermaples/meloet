[package]
name = "meloet-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test builds only: marks the audio block on a thread-local flag so a counting allocator can
# see allocations made inside it. Off in the product build, where the marker is a no-op.
rt-check = []

[dependencies]
cpal.workspace = true
libc.workspace = true
meloet-plugin.workspace = true
rtrb.workspace = true

[dev-dependencies]
meloet-engine = { path = ".", features = ["rt-check"] }
