[package]
name = "meloet-plughost"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# libdbus, already linked by meloet-app: asks rtkit for a real-time priority.
dbus = { workspace = true }
libc = { workspace = true }
livi = { workspace = true }
lv2_raw = { workspace = true }
meloet-plugin = { workspace = true }
rtrb = { workspace = true }
serde_json = { workspace = true }
vst3 = { workspace = true }
# Through libxcb: it also finds an X server that has no socket file (docs/report.md 3-1).
x11rb = { version = "=0.14.0", features = ["allow-unsafe-code", "randr"] }

[dev-dependencies]
meloet-engine = { workspace = true, features = ["rt-check"] }
