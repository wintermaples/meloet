[package]
name = "meloet-plughost"
version = "0.2.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake plugins (MELOET_PLUGHOST_FAKE) and the switches of the tests (MELOET_PLUGHOST_RT,
# MELOET_PLUGHOST_NO_DUMP). Not in the build that is handed out (docs/architecture.md 23-11).
# The unit tests have them without it.
dev-hooks = []

[dependencies]
# libdbus, already linked by meloet-app: asks rtkit for a real-time priority.
dbus = { workspace = true }
libc = { workspace = true }
livi = { workspace = true }
lv2_raw = { workspace = true }
meloet-plugin = { workspace = true }
rtrb = { workspace = true }
serde_json = { workspace = true }
vst3 = { workspace = true }
# Through libxcb: it also finds an X server that has no socket file (docs/history/report.md 3-1).
x11rb = { version = "=0.14.0", features = ["allow-unsafe-code", "randr"] }

[dev-dependencies]
meloet-engine = { workspace = true, features = ["rt-check"] }
