<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>決めたこと — トラックの 5 色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#121212}
*{box-sizing:border-box}
h1,h2,p{margin:0}
.m{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.l{font-size:12px;color:#9A9A9A}
.r{display:grid;grid-template-columns:4px 28px 88px 72px 56px 1fr;align-items:center;gap:8px;height:28px;border-bottom:1px solid #2C2C2C}
</style>
</helmet>
<div style="width: 800px; height: 480px; padding: 24px 32px; display: flex; flex-direction: column; gap: 12px; background: #121212; color: #D6D6D6; font-family: 'IBM Plex Sans JP', 'Noto Sans JP', sans-serif; font-size: 12px; line-height: 1.5; overflow: hidden">
<h1 style="font-size: 20px; font-weight: 600; color: #F2F2F2">トラックの 5 色を引っこし</h1>
<p class="l">アクセント、メーター、録音の色は動かさない。トラックの色は色相 180〜322 度へ移し、明るさも 5 段に分けた。</p>
<div style="display: flex; flex-direction: column">
<div class="r l"><span></span><span></span><span>使う所</span><span>色</span><span>色相</span><span>明るさ（相対輝度）</span></div>
<sc-for list="{{rows}}" as="c" hint-placeholder-count="14">
<div class="r" style="border-top: {{c.sep}}"><span style="height: 100%; background: {{c.hex}}"></span><span style="width: 28px; height: 12px; background: {{c.hex}}"></span><span style="color: {{c.fg}}">{{c.name}}</span><span class="m" style="color: {{c.fg}}">{{c.hex}}</span><span class="m">{{c.hue}}</span><span style="display: flex; align-items: center; gap: 8px"><span style="width: 120px; height: 4px; background: #0A0A0A"><span style="display: block; width: {{c.lum}}%; height: 100%; background: #D6D6D6"></span></span><span class="m">{{c.lum}}</span><span class="l">{{c.note}}</span></span></div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
const R = (name, hex, hue, lum, note, o) => Object.assign({ name, hex, hue, lum, note: note || '', fg: '#F2F2F2', sep: '0' }, o || {});
const rows = [
R('1 ピアノ', '#69E4E4', '180.0', '64.1'),
R('2 ベース', '#5ABDF2', '200.9', '45.0'),
R('3 ドラム', '#6F8BED', '226.7', '28.0'),
R('4 パッド', '#8C54C3', '270.3', '15.9'),
R('5 ボーカル', '#FFD9F1', '322.1', '77.2'),
R('アクセント', '#FFB000', '41.4', '52.3', '動かさない', { sep: '1px solid #5E5E5E' }),
R('メーター 黄', '#FFD60A', '50.0', '69.4', '動かさない'),
R('メーター 緑', '#4CD964', '130.2', '52.1', '動かさない'),
R('録音', '#FF3B30', '3.2', '24.6', '動かさない'),
R('前のベース', '#E69138', '30.7', '37.4', 'アクセントの近所だった', { sep: '1px solid #5E5E5E', fg: '#9A9A9A' }),
R('前のボーカル', '#D9D26A', '56.2', '61.9', 'メーターの黄の近所だった', { fg: '#9A9A9A' })
];
return { rows };
}
}
</script>
</body>
</html>
