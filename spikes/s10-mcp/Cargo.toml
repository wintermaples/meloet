[package]
name = "s10-mcp"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: this spike stays out of the product workspace and its Cargo.lock.
[workspace]

[dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-async-rw"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "net", "signal"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
