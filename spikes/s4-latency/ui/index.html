<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>s4-latency</title>
<style>
  html, body { margin: 0; background: #121212; color: #D6D6D6; font: 12px/16px sans-serif; }
  .bar { display: flex; align-items: center; gap: 20px; height: 52px; padding: 0 12px; background: #0A0A0A; border-bottom: 1px solid #3A3A3A; }
  #kb { display: flex; gap: 1px; height: 32px; }
  .k { width: 12px; background: #1A1A1A; } .k.b { background: #0A0A0A; } .k.on { background: #FFB000; }
  #meters { display: flex; gap: 2px; height: 200px; padding: 12px; }
  .m { width: 6px; background: #0A0A0A; position: relative; } .m > i { position: absolute; left: 0; right: 0; bottom: 0; background: #4CD964; }
  .mono { font-family: monospace; color: #F2F2F2; }
  #log { white-space: pre; padding: 12px; color: #9A9A9A; }
</style></head>
<body>
  <div class="bar"><span id="dev">鍵盤なし</span><div id="kb"></div><span class="mono" id="vel">—</span><span class="mono" id="pos">—</span><span id="mode"></span></div>
  <div id="meters"></div>
  <div id="log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
